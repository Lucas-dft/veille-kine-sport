name: Veille quotidienne — scraping

# Orchestrateur du scraping quotidien. On passe par GitHub Actions plutôt que
# par un cron Vercel car l'ensemble Brave Search + Gemini sur ~10 catégories
# peut dépasser la limite des fonctions serverless Vercel en Hobby (60s) ;
# GitHub Actions n'a pas cette contrainte. Ce workflow appelle
# /api/cron/scrape une fois par catégorie de sources, séquentiellement, pour
# rester rapide côté serveur.
on:
  schedule:
    # 05:00 UTC ≈ 6h/7h à Paris selon heure d'été/hiver (voir README pour ajuster).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scraper chaque catégorie de sources
        run: |
          categories=(
            "football-europe"
            "football-cl"
            "football-na"
            "basketball-na"
            "basketball-eu"
            "football-us"
            "rugby"
            "hockey-baseball"
            "autres-sports"
            "gmail-alerts"
          )
          failed=0
          for category in "${categories[@]}"; do
            echo "→ Scraping : $category"
            # Pas de --fail : une catégorie en erreur (ex. 500 transitoire côté
            # Gemini/Brave) ne doit pas empêcher de scraper les suivantes. On
            # affiche le code HTTP et le corps de la réponse pour diagnostiquer,
            # et on fait échouer le job à la fin s'il y a eu au moins une erreur.
            http_status=$(curl --silent --show-error --output /tmp/scrape_response.json --write-out "%{http_code}" \
              -X POST "${APP_URL}/api/cron/scrape" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d "{\"category\":\"$category\"}")
            cat /tmp/scrape_response.json
            echo ""
            if [ "$http_status" -ge 400 ]; then
              echo "⚠️  Échec pour $category (HTTP $http_status)"
              failed=1
            fi
          done
          exit $failed
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Vérifier les liens expirés
        if: always()
        run: |
          curl --fail --silent --show-error \
            -X POST "${APP_URL}/api/cron/check-links" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

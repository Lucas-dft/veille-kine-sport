name: Veille quotidienne — scraping

# Orchestrateur du scraping quotidien. On passe par GitHub Actions plutôt que
# par un cron Vercel car l'ensemble Brave Search + Gemini sur ~10 catégories
# peut dépasser la limite des fonctions serverless Vercel en Hobby (60s) ;
# GitHub Actions n'a pas cette contrainte. Ce workflow appelle
# /api/cron/scrape une fois par catégorie de sources, séquentiellement, pour
# rester rapide côté serveur.
on:
  schedule:
    # 05:00 UTC ≈ 6h/7h à Paris selon heure d'été/hiver (voir README pour ajuster).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scraper chaque catégorie de sources
        run: |
          set -e
          categories=(
            "football-europe"
            "football-cl"
            "football-na"
            "basketball-na"
            "basketball-eu"
            "football-us"
            "rugby"
            "hockey-baseball"
            "autres-sports"
            "gmail-alerts"
          )
          for category in "${categories[@]}"; do
            echo "→ Scraping : $category"
            curl --fail --silent --show-error \
              -X POST "${APP_URL}/api/cron/scrape" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d "{\"category\":\"$category\"}"
            echo ""
          done
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Vérifier les liens expirés
        run: |
          curl --fail --silent --show-error \
            -X POST "${APP_URL}/api/cron/check-links" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
